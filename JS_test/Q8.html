<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background: white;
            color: black;
        }
        .dark{
            background: black;
            color: white;
        }
    </style>
</head>
<body >
    <h1>theme</h1>
    <p id="p" style="cursor: pointer;">⭐</p>
    
    <Script>
        const p = document.getElementById("p")
        p.addEventListener("click",()=>{
            document.body.classList.toggle("dark")
        })
    </Script>
</body>
</html>
